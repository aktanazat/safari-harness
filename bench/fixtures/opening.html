<!doctype html>
<title>Login</title>
<!-- On 10-05 Cvent's sign-on page showed only a progress indicator before
     sending the tab to its sign-in service. There was no loading text or
     aria-busy for open's readiness check to recognize. -->
<div role="progressbar" aria-label="Loading" style="width: 32px; height: 32px">
  <svg width="32" height="32"><circle cx="16" cy="16" r="12" fill="none" stroke="black" /></svg>
</div>
