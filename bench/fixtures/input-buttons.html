<!doctype html>
<title>Input buttons</title>
<!-- Checkout forms (09-29): buttons made of inputs, which show their value
     as their name, and an image button, which shows its alt. -->
<input type="submit" value="Place order">
<input type="button" value="Add to cart" onclick="said.textContent = 'Added to cart'">
<input type="image" alt="Search" style="width: 24px; height: 24px" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
<p id="said"></p>
