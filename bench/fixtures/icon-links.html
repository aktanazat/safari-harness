<!doctype html>
<title>Icon links</title>
<!-- Amazon's product page (09-30): a link with no text of its own, whose
     first labelled element is an icon with an empty aria-label, took the
     whole snapshot down. Each link is named by its picture's label. -->
<style>.icon { display: inline-block; width: 16px; height: 16px; }</style>
<a href="#cart"><span class="icon" aria-label=""></span><img class="icon" src="cart.png" alt="Cart"></a>
<a href="#help"><i class="icon" aria-label="Help"></i></a>
