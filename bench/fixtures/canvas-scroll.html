<!doctype html>
<title>Canvas scroll</title>
<!-- A Flutter page with its accessibility tree off (GEICO's policy pages):
     one canvas fills the window, and on a wheel the page scrolls what it
     draws there, cancelling the wheel. -->
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
<canvas></canvas>
<p id="at" style="position: fixed; top: 0; margin: 0;">Drawn from 0</p>
<script>
  let offset = 0;
  document.querySelector("canvas").addEventListener("wheel", (e) => {
    e.preventDefault();
    offset += e.deltaY;
    at.textContent = `Drawn from ${offset}`;
  }, { passive: false });
</script>
