<!doctype html>
<title>Radio values</title>
<!-- Radios with no label are named by their group, so the value is all
     that tells them apart. A labeled one says its value in its name. -->
<p>Size</p>
<input type="radio" name="size" value="s"> <input type="radio" name="size" value="m">
<label><input type="radio" name="plan" value="pro"> Pro plan</label>
