<!doctype html>
<title>Set a new password</title>
<!-- Paradox's reset page (09-29): its one field is named "password",
     unmarked; only its placeholder says it takes the new one. -->
<input type="password" name="password" id="password" placeholder="New password">
<button type="button" id="save">Save</button>
<p id="said"></p>
<script>
  save.addEventListener("click", () => {
    said.textContent = password.value ? "New password saved" : "Please enter a new password";
  });
</script>
