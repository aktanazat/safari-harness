<!doctype html>
<title>Inner scroll</title>
<!-- An app shell (a mail list, a Flutter page's scrollable box): the window
     never scrolls; a box filling it does. -->
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  main { height: 100%; overflow: auto; }
</style>
<main><div style="height: 3000px"><p style="position: relative; margin: 0">Top of the list.</p><span style="position: absolute; top: -1000px">Placed above the page.</span></div></main>
