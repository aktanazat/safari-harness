<!doctype html>
<title>Account</title>
<!-- A site's Privacy settings, opened by the agent: switches for its
     cookies over the page. It is what the agent asked to read. -->
<main>
  <h1>Account</h1>
  <p>Signed in.</p>
</main>
<div role="dialog" aria-modal="true" aria-label="Privacy settings">
  <p>Choose which cookies this site may set.</p>
  <label><input type="checkbox" role="switch" checked> Analytics cookies</label>
  <label><input type="checkbox" role="switch"> Advertising cookies</label>
  <button type="button">Save</button>
</div>
