<!doctype html>
<title>Flutter choice</title>
<!-- GEICO's Flutter verification step (09-29): each choice is drawn on a
     canvas, and only its semantics node's aria-label names it. -->
<flutter-view>
  <flt-glass-pane></flt-glass-pane>
  <flt-semantics-host>
    <flt-semantics role="radio" tabindex="0" aria-label="Get an Email ak***@gmail.com"></flt-semantics>
    <flt-semantics role="radio" tabindex="0" aria-label="Get a Text Message ***-1234"></flt-semantics>
  </flt-semantics-host>
</flutter-view>
