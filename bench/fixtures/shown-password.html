<!doctype html>
<title>Shown new password</title>
<!-- Mail.ru's reset form (09-29): the new password shows as text, marked
     new-password, and its repeat is a text field named so, unmarked. -->
<input type="hidden" name="username" autocomplete="username">
<input type="text" name="password" autocomplete="new-password" aria-label="New Password">
<input type="text" name="repeat-password" aria-label="Re-enter your new password">
<button type="button" id="save">Change password</button>
<p id="said"></p>
<script>
  save.addEventListener("click", () => {
    const [fresh, repeat] = document.querySelectorAll("input[type=text]");
    said.textContent = fresh.value && fresh.value === repeat.value ? "Password changed" : "The passwords do not match";
  });
</script>
