<!doctype html>
<title>Dashboard</title>
<!-- A savings site's dashboard (11-17): a tracking-consent dialog open over
     the page, which a map read returned in place of the page. -->
<main>
  <h1>Your accounts</h1>
  <p>Cash account: interest paid monthly.</p>
</main>
<div role="dialog" aria-modal="true" aria-label="Web tracking consent preferences">
  <p>We use web trackers to improve the experience of users of our website as described in our privacy policy. Choose "Accept" to allow all Web Trackers or "Decline" to only allow essential trackers.</p>
  <button type="button">Accept</button>
  <button type="button">Decline</button>
</div>
