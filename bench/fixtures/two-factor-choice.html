<!doctype html>
<title>Choose a way to confirm it's you</title>
<!-- A two-step sign-in that asks how to send the code before it shows a
     field for it, as Instagram's did on 10-23. -->
<h1>Choose a way to confirm it's you</h1>
<form>
  <label><input type="radio" name="method" value="totp"> Authentication app</label>
  <label><input type="radio" name="method" value="sms"> Text message</label>
  <label><input type="radio" name="method" value="whatsapp"> WhatsApp</label>
  <button type="button">Continue</button>
</form>
<a href="#help">Need help?</a>
