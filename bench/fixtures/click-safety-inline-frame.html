<!doctype html>
<title>Inline frame click safety</title>
<style>
  .frame-box { position: relative; width: 320px; height: 160px; margin: 24px; }
  iframe { width: 320px; height: 160px; border: 0; }
  #frame-cover { position: absolute; inset: 0; z-index: 2; background: white; }
</style>
<div class="frame-box">
  <iframe title="Inline form" srcdoc="<button id='frame-action' data-clicks='0' onclick='this.dataset.clicks = String(Number(this.dataset.clicks) + 1)'>Inline action</button>"></iframe>
  <div id="frame-cover">Parent blocking notice</div>
</div>
<script>if (location.search.includes("clear")) document.getElementById("frame-cover").hidden = true;</script>
