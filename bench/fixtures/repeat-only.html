<!doctype html>
<title>Repeat-only reset</title>
<!-- Quest's and Covered California's reset forms (09-29): the new password
     field is named only "password", unmarked; its repeat is named so. -->
<input type="password" name="password" aria-label="Password">
<input type="password" name="confirmedPassword" aria-label="Confirm password">
<button type="button" id="reset">Reset password</button>
<p id="said"></p>
<script>
  reset.addEventListener("click", () => {
    const [fresh, repeat] = document.querySelectorAll("input[type=password]");
    said.textContent = fresh.value && fresh.value === repeat.value ? "Password reset" : "The passwords do not match";
  });
</script>
